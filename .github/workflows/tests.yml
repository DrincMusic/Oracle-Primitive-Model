name: OPM source tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-study.txt
            requirements-torch-cpu.txt
      - name: Install CPU PyTorch
        run: >-
          python -m pip install
          --index-url https://download.pytorch.org/whl/cpu
          -r requirements-torch-cpu.txt
      - name: Install study dependencies
        run: python -m pip install -r requirements-study.txt
      - name: Run OPM tests
        run: python tools/opm_agent.py test

name: Verify frozen OPM study

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check agent entry point
        run: python tools/opm_agent.py doctor --json
      - name: Check setup plan
        run: python tools/opm_agent.py setup --dry-run
      - name: Verify public export and closeout
        run: python tools/opm_agent.py verify
